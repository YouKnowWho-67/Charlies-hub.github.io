<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #050505;
            color: white;

            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 430px;

            padding: 35px;

            text-align: center;

            background: #111;

            border: 1px solid #292929;
            border-radius: 20px;

            box-shadow:
                0 20px 60px rgba(0,0,0,.5);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        p {
            color: #999;
            line-height: 1.5;
        }

        button {
            width: 100%;

            margin-top: 20px;

            padding: 15px;

            border: none;
            border-radius: 10px;

            background: #ffffff;
            color: #000000;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: .85;
        }

        .logs-button {
            background: #222;
            color: white;

            border: 1px solid #444;
        }

        .hidden {
            display: none !important;
        }

        #status {
            margin-top: 15px;
            color: #888;
            font-size: 13px;
        }

        .check {
            font-size: 55px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <!-- VERIFICATION -->

    <div class="card" id="verification">

        <div class="check">
            ✓
        </div>

        <h1>
            Verification Required
        </h1>

        <p>
            Press the button below to verify.
        </p>

        <button
            id="verifyButton"
            onclick="verify()"
        >
            OK — Verify
        </button>

        <div id="status"></div>

    </div>


    <!-- VERIFIED -->

    <div
        class="card hidden"
        id="verified"
    >

        <div class="check">
            ✓
        </div>

        <h1>
            Verified
        </h1>

        <p id="ipText">
            Verification successful.
        </p>

        <!-- THIS IS THE LOGS BUTTON -->

        <button
            class="logs-button"
            onclick="window.location.href='logs.html'"
        >
            LOGS
        </button>

    </div>


    <script>

        async function verify() {

            const button =
                document.getElementById(
                    "verifyButton"
                );

            const status =
                document.getElementById(
                    "status"
                );

            button.disabled = true;

            button.textContent =
                "Verifying...";

            try {

                /*
                 * Get public IP
                 */

                const response =
                    await fetch(
                        "https://api.ipify.org?format=json"
                    );

                if (!response.ok) {
                    throw new Error(
                        "IP request failed"
                    );
                }

                const data =
                    await response.json();

                const ip =
                    data.ip;


                /*
                 * Create log
                 */

                const log = {
                    ip: ip,
                    time: new Date().toLocaleString()
                };


                /*
                 * Get old logs
                 */

                let logs =
                    JSON.parse(
                        localStorage.getItem(
                            "verificationLogs"
                        ) || "[]"
                    );


                /*
                 * Add new log
                 */

                logs.push(log);


                /*
                 * Save logs
                 */

                localStorage.setItem(
                    "verificationLogs",
                    JSON.stringify(logs)
                );


                /*
                 * Show IP
                 */

                document.getElementById(
                    "ipText"
                ).textContent =
                    "Verified successfully. IP: " +
                    ip;


                /*
                 * Hide verification card
                 */

                document.getElementById(
                    "verification"
                ).classList.add(
                    "hidden"
                );


                /*
                 * SHOW VERIFIED CARD
                 */

                document.getElementById(
                    "verified"
                ).classList.remove(
                    "hidden"
                );


            } catch (error) {

                console.error(error);

                status.textContent =
                    "Could not verify. Try again.";

                button.disabled = false;

                button.textContent =
                    "OK — Verify";

            }

        }

    </script>

</body>
</html>
