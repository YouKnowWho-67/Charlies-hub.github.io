    <!-- VERIFICATION SCREEN -->
    <div class="screen" id="verificationScreen">

    <div class="screen" id="verifiedScreen">

                ✓

            </h1>

            <p class="verified-text">

    <script>
        const verifyButton =
            document.getElementById("verifyButton");

        const status =
            document.getElementById("status");

        const verificationScreen =
            document.getElementById("verificationScreen");

        const verifiedScreen =
            document.getElementById("verifiedScreen");


        verifyButton.addEventListener("click", async () => {

            verifyButton.disabled = true;
            verifyButton.textContent = "Verifying...";
            status.textContent = "";


            /*
             * This sends the verification event to your
             * backend/serverless endpoint.
             *
             * GitHub Pages itself cannot receive this request
             * and store IP addresses.
             */

            try {

                await fetch("https://epnfnyckpbcaxnroqtjc.supabase.co/functions/v1/verify", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    }
                });

            } catch (error) {

                /*
                 * The page can still continue if the logging
                 * service is temporarily unavailable.
                 */

                console.log("Verification logging unavailable.");

            }


            // Animate verification screen away
            verificationScreen.classList.add("fade-out");


            setTimeout(() => {

                verificationScreen.style.display = "none";

                verifiedScreen.style.display = "flex";

                verifiedScreen.classList.add("fade-in");

            }, 400);

        });
    </script>

</body>
