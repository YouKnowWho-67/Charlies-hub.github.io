<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCPC-Auto Wi-Fi & Custom DNS Setup Guide</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .transition-all-300 {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300">

    <!-- Header -->
    <header class="w-full border-b border-slate-200 dark:border-slate-800 glass sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                    <i class="fa-solid fa-wifi text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Network Setup</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">HCPC-auto DNS Guide</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <!-- Theme Toggle Button -->
                <button id="themeToggle" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all-300 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-8 w-full flex-grow flex flex-col justify-center">
        
        <!-- Progress Bar & Stepper Header -->
        <div class="mb-8">
            <div class="flex justify-between items-center mb-3">
                <span id="stepBadge" class="px-3 py-1 bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300 font-semibold text-xs rounded-full uppercase tracking-wider">
                    Step 1 of 9
                </span>
                <span id="progressPercent" class="text-xs font-semibold text-slate-500 dark:text-slate-400">
                    11% Completed
                </span>
            </div>
            
            <!-- Overall Progress Bar Track -->
            <div class="w-full h-2.5 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden p-0.5">
                <div id="progressBar" class="h-full bg-gradient-to-r from-blue-500 to-indigo-600 rounded-full transition-all duration-500 ease-out w-[11%]"></div>
            </div>

            <!-- Horizontal Stepper Dots (Scrollable on small screens) -->
            <div class="flex justify-between items-center mt-6 overflow-x-auto pb-2 pt-1 no-scrollbar space-x-2 sm:space-x-0" id="stepperDots">
                <!-- Dynamically generated step icons -->
            </div>
        </div>

        <!-- Card Container -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200/80 dark:border-slate-700/60 overflow-hidden transition-all-300">
            
            <!-- Step Header Banner -->
            <div class="p-6 sm:p-8 border-b border-slate-100 dark:border-slate-700/50 bg-slate-50/50 dark:bg-slate-800/50">
                <div class="flex items-start space-x-4">
                    <div id="stepIconContainer" class="w-12 h-12 rounded-2xl bg-blue-500/10 text-blue-600 dark:text-blue-400 flex items-center justify-center shrink-0 text-xl font-bold">
                        <i id="stepIcon" class="fa-solid fa-wifi"></i>
                    </div>
                    <div>
                        <h2 id="stepTitle" class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">
                            Connect to HCPC-auto wifi
                        </h2>
                        <p id="stepDescription" class="text-slate-500 dark:text-slate-400 text-sm mt-1">
                            Follow the interactive preview below to complete this step.
                        </p>
                    </div>
                </div>
            </div>

            <!-- Step Interactive Workspace -->
            <div class="p-6 sm:p-8 min-h-[300px] flex flex-col justify-center bg-slate-50/30 dark:bg-slate-900/20" id="stepContent">
                <!-- Content injected via JS -->
            </div>

            <!-- Card Footer Controls -->
            <div class="px-6 py-4 sm:px-8 sm:py-5 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-100 dark:border-slate-700/50 flex items-center justify-between">
                <button id="prevBtn" onclick="changeStep(-1)" class="px-5 py-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-200/60 dark:hover:bg-slate-700 font-medium text-sm transition-all disabled:opacity-40 disabled:cursor-not-allowed flex items-center space-x-2">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                    <span>Previous</span>
                </button>

                <div class="flex items-center space-x-2">
                    <button id="nextBtn" onclick="changeStep(1)" class="px-6 py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-medium text-sm rounded-xl shadow-lg shadow-blue-500/25 transition-all flex items-center space-x-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <span id="nextBtnText">Next Step</span>
                        <i id="nextBtnIcon" class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-xs text-slate-400 dark:text-slate-500 border-t border-slate-200/50 dark:border-slate-800">
        <p>Interactive Network Setup Tutorial &bull; Designed for HCPC-auto Users</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Steps Data
        const stepsData = [
            {
                number: 1,
                title: "Connect to HCPC-auto wifi.",
                description: "Ensure your device Wi-Fi is enabled and select 'HCPC-auto' from the network list.",
                icon: "fa-wifi",
                interactiveType: "connect-wifi"
            },
            {
                number: 2,
                title: "Click on the connected wifi settings.",
                description: "After connecting, click or tap on 'HCPC-auto' to access its network settings menu.",
                icon: "fa-gear",
                interactiveType: "click-settings"
            },
            {
                number: 3,
                title: "Open Network Settings",
                description: "Locate and select the 'Network Settings' or Network details option.",
                icon: "fa-sliders",
                interactiveType: "open-network-settings"
            },
            {
                number: 4,
                title: "Find the network section and open available settings.",
                description: "Navigate through the parameters to locate the main network configuration section.",
                icon: "fa-network-wired",
                interactiveType: "find-section"
            },
            {
                number: 5,
                title: "Press custom name servers",
                description: "Toggle or tap on the 'Custom Name Servers' / DNS configuration option.",
                icon: "fa-server",
                interactiveType: "press-custom"
            },
            {
                number: 6,
                title: "Erase the first 3 boxes",
                description: "Clear out any existing default IP addresses in the top three DNS input fields.",
                icon: "fa-eraser",
                interactiveType: "erase-boxes"
            },
            {
                number: 7,
                title: "Enter numbers into the DNS boxes",
                description: "Fill the cleared boxes with the designated DNS addresses.",
                icon: "fa-pen-to-square",
                interactiveType: "enter-numbers"
            },
            {
                number: 8,
                title: "Save changes and minimize tab",
                description: "Confirm the changes by clicking to the right of the boxes a few times, then minimize or close the tab.",
                icon: "fa-floppy-disk",
                interactiveType: "save-changes"
            },
            {
                number: 9,
                title: "Finished!",
                description: "Your network custom DNS configuration is complete and ready to use.",
                icon: "fa-circle-check",
                interactiveType: "finished"
            }
        ];

        let currentStep = 0;
        let stepState = {
            step1Connected: false,
            step5CustomEnabled: false,
            step6Erased: false,
            step7Values: ["", "", ""],
            step8Saved: false
        };

        const targetDNS = ["66.23.198.252", "66.94.105.229", "167.86.91.171"];

        // Initialize App
        document.addEventListener("DOMContentLoaded", () => {
            initTheme();
            renderStepperDots();
            loadStep(0);

            // Add key listener for arrow key navigation
            document.addEventListener('keydown', (e) => {
                if (e.key === "ArrowRight" && currentStep < stepsData.length - 1) {
                    changeStep(1);
                } else if (e.key === "ArrowLeft" && currentStep > 0) {
                    changeStep(-1);
                }
            });
        });

        // Theme Switcher Logic
        function initTheme() {
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            
            // Check prefer dark mode
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
                themeIcon.className = 'fa-solid fa-sun';
            }

            themeToggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                if (document.documentElement.classList.contains('dark')) {
                    themeIcon.className = 'fa-solid fa-sun';
                } else {
                    themeIcon.className = 'fa-solid fa-moon';
                }
            });
        }

        // Render Dots in Progress Header
        function renderStepperDots() {
            const dotsContainer = document.getElementById('stepperDots');
            dotsContainer.innerHTML = '';

            stepsData.forEach((step, index) => {
                const btn = document.createElement('button');
                btn.className = `flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold transition-all duration-300 ${
                    index === currentStep
                        ? 'bg-blue-600 text-white ring-4 ring-blue-500/20'
                        : index < currentStep
                        ? 'bg-blue-100 text-blue-600 dark:bg-blue-900/60 dark:text-blue-300'
                        : 'bg-slate-200 text-slate-500 dark:bg-slate-700 dark:text-slate-400'
                }`;
                btn.onclick = () => goToStep(index);
                btn.title = `Step ${index + 1}: ${step.title}`;
                
                if (index < currentStep) {
                    btn.innerHTML = `<i class="fa-solid fa-check text-[10px]"></i>`;
                } else {
                    btn.innerText = index + 1;
                }

                dotsContainer.appendChild(btn);
            });
        }

        // Update Stepper Dots active state
        function updateStepperDots() {
            const dotsContainer = document.getElementById('stepperDots');
            const buttons = dotsContainer.querySelectorAll('button');
            buttons.forEach((btn, index) => {
                if (index === currentStep) {
                    btn.className = 'flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold bg-blue-600 text-white ring-4 ring-blue-500/20 transition-all duration-300';
                    btn.innerText = index + 1;
                } else if (index < currentStep) {
                    btn.className = 'flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold bg-blue-100 text-blue-600 dark:bg-blue-900/60 dark:text-blue-300 transition-all duration-300';
                    btn.innerHTML = `<i class="fa-solid fa-check text-[10px]"></i>`;
                } else {
                    btn.className = 'flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold bg-slate-200 text-slate-500 dark:bg-slate-700 dark:text-slate-400 transition-all duration-300';
                    btn.innerText = index + 1;
                }
            });
        }

        // Change step with offset (+1 or -1)
        function changeStep(offset) {
            const newStep = currentStep + offset;
            if (newStep >= 0 && newStep < stepsData.length) {
                goToStep(newStep);
            }
        }

        // Jump to specific step
        function goToStep(stepIndex) {
            currentStep = stepIndex;
            loadStep(currentStep);
            updateStepperDots();
        }

        // Load step data into the UI
        function loadStep(index) {
            const step = stepsData[index];

            // Progress Update
            const percent = Math.round(((index + 1) / stepsData.length) * 100);
            document.getElementById('stepBadge').innerText = `Step ${index + 1} of ${stepsData.length}`;
            document.getElementById('progressPercent').innerText = `${percent}% Completed`;
            document.getElementById('progressBar').style.width = `${percent}%`;

            // Text Update
            document.getElementById('stepTitle').innerText = step.title;
            document.getElementById('stepDescription').innerText = step.description;
            document.getElementById('stepIcon').className = `fa-solid ${step.icon}`;

            // Buttons state
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const nextBtnText = document.getElementById('nextBtnText');
            const nextBtnIcon = document.getElementById('nextBtnIcon');

            prevBtn.disabled = index === 0;

            if (index === stepsData.length - 1) {
                nextBtnText.innerText = "Restart Guide";
                nextBtnIcon.className = "fa-solid fa-rotate-right text-xs";
                nextBtn.onclick = () => {
                    resetState();
                    goToStep(0);
                };
            } else {
                nextBtnText.innerText = "Next Step";
                nextBtnIcon.className = "fa-solid fa-arrow-right text-xs";
                nextBtn.onclick = () => changeStep(1);
            }

            // Render interactive section content
            renderInteractiveContent(step.interactiveType);
        }

        // Reset step state
        function resetState() {
            stepState = {
                step1Connected: false,
                step5CustomEnabled: false,
                step6Erased: false,
                step7Values: ["", "", ""],
                step8Saved: false
            };
        }

        // Render step interactive workspace content
        function renderInteractiveContent(type) {
            const container = document.getElementById('stepContent');
            container.innerHTML = '';

            switch (type) {
                case 'connect-wifi':
                    container.innerHTML = `
                        <div class="max-w-md mx-auto w-full bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm border border-slate-200 dark:border-slate-700">
                            <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700/50 mb-3">
                                <span class="font-semibold text-sm">Available Wi-Fi Networks</span>
                                <i class="fa-solid fa-arrows-rotate text-xs text-slate-400 cursor-pointer hover:rotate-180 transition-transform"></i>
                            </div>
                            <div class="space-y-2">
                                <div onclick="toggleStep1Wifi()" class="p-3 rounded-lg border border-blue-500/40 bg-blue-50/50 dark:bg-blue-900/20 flex items-center justify-between cursor-pointer hover:border-blue-500 transition-all">
                                    <div class="flex items-center space-x-3">
                                        <i class="fa-solid fa-wifi text-blue-600 dark:text-blue-400"></i>
                                        <span class="font-medium text-sm">HCPC-auto</span>
                                    </div>
                                    <span id="wifiStatus1" class="text-xs px-2.5 py-1 rounded-full ${stepState.step1Connected ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300' : 'bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300'}">
                                        ${stepState.step1Connected ? 'Connected ✓' : 'Click to Connect'}
                                    </span>
                                </div>
                                <div class="p-3 rounded-lg border border-slate-100 dark:border-slate-700/50 opacity-50 flex items-center justify-between">
                                    <div class="flex items-center space-x-3">
                                        <i class="fa-solid fa-wifi text-slate-400"></i>
                                        <span class="font-medium text-sm text-slate-500">Public-Guest</span>
                                    </div>
                                    <i class="fa-solid fa-lock text-xs text-slate-400"></i>
                                </div>
                            </div>
                        </div>
                    `;
                    break;

                case 'click-settings':
                    container.innerHTML = `
                        <div class="max-w-md mx-auto w-full bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 text-center">
                            <div class="p-4 rounded-xl bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800/50 mb-4 inline-block">
                                <i class="fa-solid fa-wifi text-3xl text-blue-600 dark:text-blue-400 mb-2"></i>
                                <h3 class="font-bold text-base">HCPC-auto</h3>
                                <p class="text-xs text-emerald-600 dark:text-emerald-400 font-medium">Connected</p>
                            </div>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">Click the gear icon or network card to open settings</p>
                            <button onclick="changeStep(1)" class="w-full p-3 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700/50 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center justify-between transition-all">
                                <span class="font-medium text-sm flex items-center space-x-2">
                                    <i class="fa-solid fa-gear text-slate-500"></i>
                                    <span>Network Settings</span>
                                </span>
                                <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
                            </button>
                        </div>
                    `;
                    break;

                case 'open-network-settings':
                    container.innerHTML = `
                        <div class="max-w-md mx-auto w-full bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 space-y-2">
                            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Network Details</div>
                            <div class="p-3 rounded-lg border border-slate-100 dark:border-slate-700/50 flex justify-between items-center text-sm">
                                <span class="text-slate-500">Signal Strength</span>
                                <span class="font-medium">Excellent</span>
                            </div>
                            <div onclick="changeStep(1)" class="p-3 rounded-lg border-2 border-blue-500 bg-blue-50/30 dark:bg-blue-900/20 flex justify-between items-center text-sm font-medium text-blue-600 dark:text-blue-400 cursor-pointer hover:bg-blue-50 dark:hover:bg-blue-900/40 transition-all">
                                <span class="flex items-center space-x-2">
                                    <i class="fa-solid fa-sliders"></i>
                                    <span>Open Advanced Network Settings</span>
                                </span>
                                <i class="fa-solid fa-arrow-right text-xs"></i>
                            </div>
                        </div>
                    `;
                    break;

                case 'find-section':
                    container.innerHTML = `
                        <div class="max-w-md mx-auto w-full bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 space-y-3">
                            <div class="p-3 rounded-lg bg-slate-50 dark:bg-slate-700/30 flex items-center justify-between opacity-60">
                                <span class="text-sm font-medium">IP Configuration</span>
                                <span class="text-xs text-slate-400">DHCP</span>
                            </div>
                            <div onclick="changeStep(1)" class="p-4 rounded-lg border-2 border-dashed border-blue-500 bg-blue-50/40 dark:bg-blue-900/20 flex items-center justify-between cursor-pointer hover:border-solid hover:bg-blue-50 dark:hover:bg-blue-900/40 transition-all">
                                <div>
                                    <div class="text-sm font-bold text-blue-600 dark:text-blue-400">DNS & Server Section</div>
                                    <div class="text-xs text-slate-500 dark:text-slate-400">Open available DNS settings</div>
                                </div>
                                <span class="px-3 py-1 bg-blue-600 text-white rounded-lg text-xs font-semibold">Open Settings</span>
                            </div>
                        </div>
                    `;
                    break;

                case 'press-custom':
                    container.innerHTML = `
                        <div class="max-w-md mx-auto w-full bg-white dark:bg-slate-800 rounded-xl p-5 shadow-sm border border-slate-200 dark:border-slate-700 text-center">
                            <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">Select DNS Type Configuration:</p>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="p-3 rounded-lg border border-slate-200 dark:border-slate-700 opacity-50 text-xs font-semibold">
                                    Automatic (DHCP)
                                </div>
                                <div onclick="toggleStep5Custom()" class="p-3 rounded-lg border-2 ${stepState.step5CustomEnabled ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600 dark:text-emerald-400' : 'border-blue-500 bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400'} cursor-pointer hover:scale-105 transition-all text-xs font-bold flex items-center justify-center space-x-1.5">
                                    <i class="fa-solid fa-server"></i>
                                    <span>Custom Name Servers</span>
                                </div>
                            </div>
                            <p id="step5Status" class="text-xs mt-4 ${stepState.step5CustomEnabled ? 'text-emerald-600 dark:text-emerald-400 font-semibold' : 'text-slate-400'}">
                                ${stepState.step5CustomEnabled ? 'Custom Name Servers Selected ✓' : 'Click "Custom Name Servers" above'}
                            </p>
                        </div>
                    `;
                    break;

                case 'erase-boxes':
                    container.innerHTML = `
                        <div class="max-w-md mx-auto w-full bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 space-y-3">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-xs font-semibold text-slate-400 uppercase">DNS Entry Fields</span>
                                <button onclick="eraseStep6Boxes()" class="px-3 py-1 bg-amber-100 dark:bg-amber-900/40 text-amber-700 dark:text-amber-300 rounded-lg text-xs font-semibold hover:bg-amber-200 transition-all">
                                    <i class="fa-solid fa-eraser mr-1"></i> Erase First 3 Boxes
                                </button>
                            </div>
                            <div class="space-y-2">
                                <input type="text" id="erase1" value="${stepState.step6Erased ? '' : '192.168.1.1'}" readonly class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm focus:outline-none transition-all">
                                <input type="text" id="erase2" value="${stepState.step6Erased ? '' : '192.168.1.2'}" readonly class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm focus:outline-none transition-all">
                                <input type="text" id="erase3" value="${stepState.step6Erased ? '' : '8.8.8.8'}" readonly class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm focus:outline-none transition-all">
                            </div>
                        </div>
                    `;
                    break;

                case 'enter-numbers':
                    container.innerHTML = `
                        <div class="max-w-lg mx-auto w-full bg-white dark:bg-slate-800 rounded-xl p-5 shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
                            <div class="text-xs font-semibold text-slate-400 uppercase">Enter designated DNS numbers</div>
                            <div class="space-y-3">
                                ${targetDNS.map((dns, i) => `
                                    <div class="flex items-center space-x-2">
                                        <span class="text-xs font-bold text-slate-400 w-12">Box ${i + 1}:</span>
                                        <input type="text" id="dnsInput${i}" value="${stepState.step7Values[i]}" placeholder="${dns}" oninput="updateDNSInput(${i}, this.value)" class="flex-grow px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm font-mono focus:border-blue-500 focus:outline-none">
                                        <button onclick="copyToClipboard('${dns}', ${i})" class="px-3 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg text-xs font-medium flex items-center space-x-1 transition-all">
                                            <i class="fa-regular fa-copy"></i>
                                            <span>Copy</span>
                                        </button>
                                        <button onclick="autoFillDNS(${i}, '${dns}')" class="px-3 py-2 bg-blue-50 dark:bg-blue-900/30 hover:bg-blue-100 text-blue-600 dark:text-blue-400 rounded-lg text-xs font-semibold transition-all">
                                            Fill
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                            <div id="copyToast" class="hidden text-center text-xs text-emerald-600 dark:text-emerald-400 font-semibold pt-1">
                                Copied to clipboard!
                            </div>
                        </div>
                    `;
                    break;

                case 'save-changes':
                    container.innerHTML = `
                        <div class="max-w-md mx-auto w-full bg-white dark:bg-slate-800 rounded-xl p-5 shadow-sm border border-slate-200 dark:border-slate-700 text-center space-y-4">
                            <p class="text-xs text-slate-500 dark:text-slate-400">Click to the right of the DNS boxes a few times to commit, then save:</p>
                            <div class="p-4 border border-slate-200 dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-900 flex justify-between items-center cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 transition-all" onclick="clickBoxRight()">
                                <div class="text-left">
                                    <div class="text-xs font-mono text-slate-500">Box 1: 66.23.198.252</div>
                                    <div class="text-xs font-mono text-slate-500">Box 2: 66.94.105.229</div>
                                    <div class="text-xs font-mono text-slate-500">Box 3: 167.86.91.171</div>
                                </div>
                                <div id="clickRightArea" class="px-3 py-6 bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300 rounded text-xs font-bold flex items-center">
                                    Click Right Area
                                </div>
                            </div>
                            <button onclick="saveAndMinimize()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-bold shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-floppy-disk"></i>
                                <span>Save Changes & Minimize Tab</span>
                            </button>
                        </div>
                    `;
                    break;

                case 'finished':
                    container.innerHTML = `
                        <div class="max-w-md mx-auto w-full text-center py-4 space-y-4">
                            <div class="w-20 h-20 bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400 rounded-full flex items-center justify-center mx-auto text-4xl shadow-lg shadow-emerald-500/10">
                                <i class="fa-solid fa-check"></i>
                            </div>
                            <h3 class="text-2xl font-bold text-slate-900 dark:text-white">Setup Completed!</h3>
                            <p class="text-sm text-slate-500 dark:text-slate-400">
                                Your network is now connected to <strong>HCPC-auto</strong> with the custom DNS servers active.
                            </p>
                            <div class="p-4 bg-slate-100 dark:bg-slate-800/60 rounded-xl text-left text-xs space-y-1 font-mono text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700">
                                <div>Primary DNS: 66.23.198.252</div>
                                <div>Secondary DNS: 66.94.105.229</div>
                                <div>Tertiary DNS: 167.86.91.171</div>
                            </div>
                        </div>
                    `;
                    break;
            }
        }

        // Helper Handlers for Step Actions
        function toggleStep1Wifi() {
            stepState.step1Connected = !stepState.step1Connected;
            renderInteractiveContent('connect-wifi');
        }

        function toggleStep5Custom() {
            stepState.step5CustomEnabled = true;
            renderInteractiveContent('press-custom');
        }

        function eraseStep6Boxes() {
            stepState.step6Erased = true;
            renderInteractiveContent('erase-boxes');
        }

        function updateDNSInput(index, val) {
            stepState.step7Values[index] = val;
        }

        function autoFillDNS(index, val) {
            stepState.step7Values[index] = val;
            const input = document.getElementById(`dnsInput${index}`);
            if (input) input.value = val;
        }

        function copyToClipboard(text, index) {
            // Fallback execCommand for iframe compatibility
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            autoFillDNS(index, text);

            const toast = document.getElementById('copyToast');
            if (toast) {
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 2000);
            }
        }

        function clickBoxRight() {
            const area = document.getElementById('clickRightArea');
            if (area) {
                area.classList.add('bg-emerald-200', 'text-emerald-800');
                area.innerText = "Confirmed ✓";
            }
        }

        function saveAndMinimize() {
            stepState.step8Saved = true;
            changeStep(1);
        }
