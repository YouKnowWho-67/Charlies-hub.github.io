<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 90%;
            max-width: 420px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
            animation: fadeIn .5s ease;
        }

        h1 {
            margin-bottom: 12px;
        }

        p {
            color: #aaa;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: white;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: .9;
        }

        .logs {
            margin-top: 12px;
            background: #1c1c1c;
            color: white;
        }

        .hidden {
            display: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<div class="box" id="verifyBox">

    <h1>Verification</h1>

    <p>
        Press the button below to verify.
    </p>

    <button onclick="verify()">
        OK — Verify
    </button>

</div>


<div class="box hidden" id="verifiedBox">

    <h1>✓ Verified</h1>

    <p id="ipText">
        Verification successful.
    </p>

    <button class="logs" onclick="location.href='logs.html'">
        View Logs
    </button>

</div>


<script>

async function verify() {

    const button = document.querySelector("#verifyBox button");

    button.disabled = true;
    button.textContent = "Verifying...";

    try {

        // Get public IP
        const response = await fetch("https://api.ipify.org?format=json");

        if (!response.ok) {
            throw new Error("Could not get IP");
        }

        const data = await response.json();

        const ip = data.ip;

        // Create log
        const log = {
            ip: ip,
            time: new Date().toLocaleString()
        };

        // Get existing logs
        let logs = JSON.parse(
            localStorage.getItem("verificationLogs") || "[]"
        );

        // Add newest log
        logs.push(log);

        // Save logs
        localStorage.setItem(
            "verificationLogs",
            JSON.stringify(logs)
        );

        // Show IP
        document.getElementById("ipText").textContent =
            "Verified successfully. IP: " + ip;

        // Switch screens
        document.getElementById("verifyBox")
            .classList.add("hidden");

        document.getElementById("verifiedBox")
            .classList.remove("hidden");

    } catch (error) {

        console.error(error);

        button.disabled = false;
        button.textContent = "OK — Verify";

        alert("Verification failed. Please try again.");

    }

}

</script>

</body>
</html>
